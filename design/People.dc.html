<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>บุคคล</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FB8FF}a:hover{color:#B5D6FF}
.lbl{font-size:12px;color:#9AA1B5}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font:500 13px 'IBM Plex Sans Thai Looped',sans-serif;color:#C9CEDC;white-space:nowrap}
.chip.on{background:#F2F4FA;color:#06070D;border-color:#F2F4FA;font-weight:600}
.person{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#F2F4FA;font-family:inherit;text-align:left}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:64px;color:#4A4E5C;text-decoration:none;font-size:12px;white-space:nowrap}
</style>
</helmet>
<div style="width:390px;min-height:1500px;box-sizing:border-box;position:relative;overflow:hidden;font-family:'IBM Plex Sans Thai Looped',sans-serif;color:#F2F4FA;background:radial-gradient(520px 420px at 90% -40px,rgba(31,165,135,.40),transparent 70%),radial-gradient(460px 380px at -10% 260px,rgba(138,92,255,.35),transparent 70%),radial-gradient(500px 420px at 70% 900px,rgba(59,107,255,.25),transparent 70%),#06070D">

<div style="padding:62px 20px 230px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:2px"><span class="lbl">ชาร์ตที่บันทึกไว้ · {{count}} คน</span><h1 style="margin:0;font-size:28px;font-weight:600">บุคคล</h1></div>
<div style="display:flex;gap:8px">
<a href="AddPerson.dc.html" aria-label="เพิ่มคน" style="width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,#8A5CFF,#3B6BFF);color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</div>
</div>

<label style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1B5" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ค้นหาชื่อ</span>
<input type="search" placeholder="ค้นหาชื่อ หรือราศี" style="flex:1;border:none;background:transparent;color:#F2F4FA;font:15px 'IBM Plex Sans Thai Looped',sans-serif;outline:none">
</label>

<button onClick="{{toggleSelect}}" aria-pressed="{{selecting}}" style="display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;border:1px solid {{cmpBorder}};background:{{cmpCard}};color:#F2F4FA;font-family:inherit;text-align:left">
<span aria-hidden="true" style="width:52px;height:52px;flex:none;border-radius:16px;background:rgba(6,7,13,.45);display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 36 36" fill="none"><circle cx="13" cy="18" r="9" stroke="#B9A6FF" stroke-width="2"></circle><circle cx="23" cy="18" r="9" stroke="#6FE0C0" stroke-width="2"></circle><path d="M18 10.6a9 9 0 0 1 0 14.8a9 9 0 0 1 0-14.8z" fill="#8FA8FF" fill-opacity=".55"></path><path d="M13 4.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="#F3D46E"></path><path d="M25 27.5l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6z" fill="#F3D46E"></path></svg></span>
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600">{{cmpTitle}}</span><span style="font-size:13px;color:#C9CEDC;line-height:1.5">{{cmpSub}}</span></span>
<span aria-hidden="true" style="width:32px;height:32px;flex:none;border-radius:999px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center">{{cmpIcon}}</span>
</button>

<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<button class="person" onClick="{{p.pick}}" aria-pressed="{{p.sel}}" style="{{p.st}}">
<sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
<span style="width:24px;height:24px;flex:none;border-radius:999px;border:2px solid {{p.ring}};background:{{p.fill}};display:flex;align-items:center;justify-content:center;color:#06070D"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
</sc-if>
<span style="width:48px;height:48px;flex:none;border-radius:999px;background:{{p.av}};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#FFFFFF">{{p.i}}</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
<span style="display:flex;align-items:center;gap:8px"><span style="font-size:16px;font-weight:600">{{p.n}}</span><span style="font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.10);color:#C9CEDC">ความสัมพันธ์: {{p.tag}}</span></span>
<span style="display:flex;gap:10px;font-size:13px;color:#C9CEDC"><span>☉&#xFE0E; {{p.sun}}</span><span>☽&#xFE0E; {{p.moon}}</span><span>AC {{p.ac}}</span></span>
<span class="lbl">{{p.b}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA1B5" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
</button>
</sc-for>
</div>
</div>

<sc-if value="{{selecting}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:16px;right:16px;bottom:104px;padding:12px;border-radius:20px;background:rgba(22,25,40,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px">
<span style="flex:1;font-size:14px;color:#DCE0EA">{{selNames}}</span>
<a href="Compare.dc.html" aria-disabled="{{notReady}}" style="height:48px;padding:0 20px;border-radius:14px;background:{{cmpBg}};color:{{cmpFg}};display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>เปรียบเทียบ</a>
</div>
</sc-if>

<nav aria-label="แท็บหลัก" style="position:absolute;left:0;right:0;bottom:0;height:91px;padding:0 6px 26px;box-sizing:border-box;border-radius:32px 32px 0 0;background:linear-gradient(180deg,#1C1D24,#000000);box-shadow:0 -8px 30px rgba(0,0,0,.30);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;border-top:1px solid rgba(255,255,255,.10)">
<a href="Main.dc.html" class="tab" style="color:#C9CEDC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/></svg>ชาร์ตของฉัน</a>
<a href="#" class="tab" aria-current="page" style="color:#B9A6FF;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>บุคคล</a>
<a href="Today.dc.html" class="tab" style="position:relative;color:#C9CEDC;font-weight:500"><span style="position:absolute;top:-44px;left:50%;margin-left:-44px;width:88px;height:88px;border-radius:999px;background:#0A0B10;display:flex;align-items:center;justify-content:center"><span style="width:72px;height:72px;border-radius:999px;background:radial-gradient(circle at 40% 30%,#3A3B44,#1A1B21);display:flex;align-items:center;justify-content:center;color:#B9A6FF"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></span>วันนี้</a>
<a href="#" class="tab" style="color:#C9CEDC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>ดวงล่วงหน้า</a>
<a href="#" class="tab" style="color:#C9CEDC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>ตั้งค่า</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
var self = this; var st = this.state || {};
var selecting = st.selecting === undefined ? true : st.selecting;
var sel = st.sel || [0, 2];
var P = [
['ต','ตัวอย่าง','ฉัน','สิงห์','พฤษภ','มีน','5 ส.ค. 2542 · 20:33 · เพชรบุรี','linear-gradient(135deg,#8A5CFF,#3B6BFF)'],
['[','[ชื่อ]','ครอบครัว','[ราศี]','[ราศี]','[ราศี]','[วันเกิด] · [เวลา] · [จังหวัด]','linear-gradient(135deg,#1FA587,#3B6BFF)'],
['[','[ชื่อ]','คนรัก','[ราศี]','[ราศี]','[ราศี]','[วันเกิด] · [เวลา] · [จังหวัด]','linear-gradient(135deg,#C2577A,#8A5CFF)'],
['[','[ชื่อ]','เพื่อน','[ราศี]','[ราศี]','—','[วันเกิด] · ไม่ทราบเวลาเกิด · [จังหวัด]','linear-gradient(135deg,#3B6BFF,#6EC8FF)'],
['[','[ชื่อ]','เพื่อน','[ราศี]','[ราศี]','[ราศี]','[วันเกิด] · [เวลา] · [จังหวัด]','linear-gradient(135deg,#1FA587,#8FD47A)']];
var people = P.map(function(r, i){
var on = sel.indexOf(i) >= 0;
return { i: r[0], n: r[1], tag: r[2], sun: r[3], moon: r[4], ac: r[5], b: r[6], av: r[7], sel: on,
ring: on ? '#7FB8FF' : 'rgba(255,255,255,.35)', fill: on ? '#7FB8FF' : 'transparent',
st: on && selecting ? 'border-color:#7FB8FF;background:rgba(127,184,255,.10)' : '',
pick: function(){
if (!selecting) return;
var s = sel.slice(); var k = s.indexOf(i);
if (k >= 0) s.splice(k, 1); else { if (s.length >= 2) s.shift(); s.push(i); }
self.setState({ sel: s });
} };
});
var names = sel.map(function(i){ return P[i][1]; }).join(' ↔ ');
var ready = sel.length === 2;
return {
people: people, count: P.length, selecting: selecting, nSel: sel.length,
cmpTitle: selecting ? 'เลือกแล้ว ' + sel.length + '/2 คน' : 'เปรียบเทียบความเข้ากัน',
cmpSub: selecting ? 'แตะชื่อด้านล่าง · แตะตรงนี้อีกครั้งเพื่อยกเลิก' : 'เลือก 2 คน ดูว่าดาวของทั้งคู่ส่งเสริมหรือท้าทายกัน',
cmpIcon: selecting ? '✕' : '›',
cmpCard: selecting ? 'rgba(127,184,255,.12)' : 'linear-gradient(135deg,rgba(138,92,255,.35),rgba(59,107,255,.25) 55%,rgba(31,165,135,.28))',
cmpBorder: selecting ? 'rgba(127,184,255,.45)' : 'rgba(170,160,255,.40)',
toggleSelect: function(){ self.setState({ selecting: !selecting }); },
selNames: sel.length ? names : 'ยังไม่ได้เลือก', notReady: ready ? 'false' : 'true',
cmpBg: ready ? 'linear-gradient(135deg,#8A5CFF,#3B6BFF)' : 'rgba(255,255,255,.10)', cmpFg: ready ? '#FFFFFF' : '#9AA1B5'
};
}
}
</script>
</body>
</html>
