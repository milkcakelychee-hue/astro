# เผยแพร่บน GitHub Pages เฉพาะเมื่อผู้ใช้สั่งเท่านั้น — push ปกติเข้า main ไม่เผยแพร่
# วิธีสั่ง: commit ล่าสุดที่ push มีคำว่า [deploy] ในข้อความ  หรือกด "Run workflow" ในแท็บ Actions
# เปิดครั้งแรก: Settings → Pages → Source = GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # ต้องผ่าน test (41 ชาร์ต + คลัง) ก่อนเผยแพร่
      - run: npm test
      - run: npm run build
        env:
          BASE: /astro/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
