<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เพิ่มหมวดความสัมพันธ์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FB8FF}a:hover{color:#B5D6FF}
.lbl{font-size:12px;color:#9AA1B5}
.card{border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}
.seg{flex:1;height:36px;border:none;border-radius:10px;background:transparent;color:#C9CEDC;font:500 13px 'IBM Plex Sans Thai Looped',sans-serif;white-space:nowrap}
.seg.on{background:#F2F4FA;color:#06070D;font-weight:600}
.in{box-sizing:border-box;width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#F2F4FA;font:16px 'IBM Plex Sans Thai Looped',sans-serif;outline:none}
.fl{font-size:14px;font-weight:600;color:#DCE0EA}
.group{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;box-sizing:border-box;width:100%;border:none;background:transparent;color:#F2F4FA;font:15px 'IBM Plex Sans Thai Looped',sans-serif;text-align:left}
.row+.row{border-top:1px solid rgba(255,255,255,.07)}
.chip{height:24px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{height:52px;border:none;border-radius:16px;font:600 16px 'IBM Plex Sans Thai Looped',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.close{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#F2F4FA;display:flex;align-items:center;justify-content:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:64px;color:#4A4E5C;text-decoration:none;font-size:12px;white-space:nowrap}
.help{width:28px;height:28px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#C9CEDC;font:600 13px 'IBM Plex Sans Thai Looped',sans-serif;display:inline-flex;align-items:center;justify-content:center;padding:0}

</style>
</helmet>
<div style="width:390px;min-height:1500px;box-sizing:border-box;position:relative;overflow:hidden;font-family:'IBM Plex Sans Thai Looped',sans-serif;color:#F2F4FA;background:radial-gradient(520px 420px at 85% -40px,rgba(138,92,255,.45),transparent 70%),radial-gradient(460px 380px at -10% 200px,rgba(31,165,135,.38),transparent 70%),#06070D">
<div aria-hidden="true" style="padding:62px 20px;opacity:.35;filter:blur(1px)"><div style="font-size:28px;font-weight:600">เพิ่มคน</div><div style="margin-top:20px;height:300px;border-radius:24px;border:1px solid rgba(255,255,255,.25)"></div></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(3,4,8,.55)"></div>
<section role="dialog" aria-label="เพิ่มหมวดความสัมพันธ์" style="position:absolute;left:0;right:0;top:80px;bottom:0;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#151827 0%,#0C0E18 240px);border-top:1px solid rgba(180,170,255,.30);box-shadow:0 -12px 40px rgba(0,0,0,.45)">
<div style="display:flex;justify-content:center;padding:10px 0 4px"><span style="width:40px;height:5px;border-radius:999px;background:rgba(255,255,255,.28)"></span></div>
<div style="padding:8px 20px 40px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:flex-start;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="lbl">เพิ่มคน · ความสัมพันธ์</span><h1 style="margin:0;font-size:21px;font-weight:600;line-height:1.35">หมวดใหม่</h1></div>
<button class="close" aria-label="ปิด"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)">
<span style="flex:none;width:64px;height:72px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:{{pvBg}};border:1px solid {{pvBd}};color:{{pvC}};font-size:13px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{pvI}}"/></svg>{{pvN}}</span>
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">ตัวอย่างป้าย</span><span class="lbl">จะแสดงแบบนี้ในหน้าเพิ่มคนและหน้าบุคคล</span></span>
</div>
<div style="display:flex;flex-direction:column;gap:8px"><label for="cn" class="fl">ชื่อหมวด</label><input id="cn" class="in" value="ทีมฟุตบอล" maxlength="12"><span class="lbl">ไม่เกิน 12 ตัวอักษร เพื่อให้พอดีป้าย</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><span class="fl">ไอคอน</span>
<div role="radiogroup" aria-label="ไอคอน" style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px"><sc-for list="{{icons}}" as="i" hint-placeholder-count="16"><button role="radio" aria-checked="{{i.on}}" aria-label="{{i.n}}" onClick="{{i.pick}}" style="aspect-ratio:1;border-radius:12px;border:1.5px solid {{i.bd}};background:{{i.bg}};color:#E6E9F2;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span class="fl">สี</span>
<div role="radiogroup" aria-label="สี" style="display:flex;gap:10px"><sc-for list="{{cols}}" as="c" hint-placeholder-count="6"><button role="radio" aria-checked="{{c.on}}" aria-label="สี" onClick="{{c.pick}}" style="width:40px;height:40px;border-radius:999px;border:3px solid {{c.ring}};background:{{c.c}};padding:0"></button></sc-for></div></div>
<button class="btn" style="background:linear-gradient(135deg,#8A5CFF,#3B6BFF 55%,#1FA587);color:#fff;margin-top:4px">บันทึกหมวด</button>
<div style="display:flex;flex-direction:column;gap:4px;padding-top:6px"><span class="fl">หมวดที่ตั้งเอง</span>
<div class="card" style="overflow:hidden"><div class="row"><span style="width:32px;height:32px;border-radius:10px;background:rgba(127,227,192,.16);color:#7FE3C0;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/></svg></span><span style="flex:1">เพื่อนมหาลัย</span><span class="lbl">3 คน</span><button aria-label="แก้ไข" style="border:none;background:transparent;color:#7FB8FF;font:500 14px 'IBM Plex Sans Thai Looped',sans-serif;padding:8px">แก้ไข</button></div></div>
<span class="lbl" style="line-height:1.6">ลบหมวดได้ในหน้าแก้ไข คนที่อยู่ในหมวดนั้นจะย้ายไป "ไม่ระบุ" ข้อมูลเกิดไม่หาย</span></div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>

var ic = st.ic === undefined ? 9 : st.ic, co = st.co === undefined ? 1 : st.co;
return { icons: IC.map(function(x,i){ var on = i === ic; return { n: x[0], d: x[1], on: on, bd: on ? CO[co] : 'rgba(255,255,255,.10)', bg: on ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.03)', pick: function(){ self.setState({ ic: i }); } }; }),

}
}
</script>
</body>
</html>
